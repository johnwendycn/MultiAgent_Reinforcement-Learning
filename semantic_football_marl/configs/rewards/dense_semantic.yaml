# @package rewards
name: "dense_semantic"
weights:
  goal_scored: 5.0
  goal_conceded: -5.0
  territorial_gain: 0.8
  pass_completion: 0.5
  shot_on_target: 1.0
  pressing_intensity: 0.2
  possession_loss: -0.4
  out_of_bounds: -0.2
  lazy_penalty: -0.01
normalize_rewards: true
clip_rewards: true
reward_clip_range: [-5.0, 5.0]
