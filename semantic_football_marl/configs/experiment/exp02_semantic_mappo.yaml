# @package _global_
# Experiment 02: Semantic Reward-Enhanced MAPPO on Academy 3v1
run_name: "exp02_semantic_mappo_seed42"
seed: 42

env:
  scenario: "academy_3_vs_1_with_keeper"
  rewards: "scoring,checkpoints"

algo:
  name: "mappo"
  ppo_epoch: 10
  lr_actor: 3.0e-4

rewards:
  weights:
    goal_scored: 5.0
    goal_conceded: -5.0
    territorial_gain: 0.8
    pass_completion: 0.5
    shot_on_target: 1.0
    pressing_intensity: 0.2
    possession_loss: -0.4
    out_of_bounds: -0.2
    lazy_penalty: -0.01

wandb:
  tags: ["semantic_reward", "mappo", "dense_reward", "academy_3v1"]
