# @package _global_
# Experiment 01: Baseline MAPPO on Academy 3v1 (Sparse Scoring Rewards)
run_name: "exp01_baseline_mappo_seed42"
seed: 42

env:
  scenario: "academy_3_vs_1_with_keeper"
  rewards: "scoring"

algo:
  name: "mappo"
  ppo_epoch: 10
  lr_actor: 3.0e-4

rewards:
  weights:
    goal_scored: 1.0
    goal_conceded: -1.0
    territorial_gain: 0.0
    pass_completion: 0.0
    shot_on_target: 0.0
    pressing_intensity: 0.0
    possession_loss: 0.0
    out_of_bounds: 0.0
    lazy_penalty: 0.0

wandb:
  tags: ["baseline", "mappo", "sparse_reward", "academy_3v1"]
